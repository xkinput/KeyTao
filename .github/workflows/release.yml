name: Release Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install rime_deployer and lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y librime-bin librime-data lua5.4

      - name: Validate schemas and Lua
        run: bash scripts/validate.sh

  build-and-release:
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build package
        run: bash scripts/release.sh "${{ steps.version.outputs.VERSION }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ASSET="release/keytao-${VERSION}.zip"

          # Find an existing release (including drafts pre-created by keytao-next auto-sync)
          EXISTING_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=30" \
            --jq "[.[] | select(.tag_name == \"${VERSION}\")] | .[0] // empty")

          if [ -n "$EXISTING_JSON" ]; then
            RELEASE_ID=$(printf '%s' "$EXISTING_JSON" | jq -r '.id')
            IS_DRAFT=$(printf '%s' "$EXISTING_JSON" | jq -r '.draft')
            EXISTING_BODY=$(printf '%s' "$EXISTING_JSON" | jq -r '.body // ""')
            UPLOAD_URL=$(printf '%s' "$EXISTING_JSON" | jq -r '.upload_url' | sed 's/{?name,label}//')

            if [ -n "$(printf '%s' "$EXISTING_BODY" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$EXISTING_BODY" > release/notes.md
            else
              python3 scripts/generate_release_notes.py "$VERSION" > release/notes.md
            fi

            # Replace asset with the same name if re-running workflow
            OLD_ASSET_ID=$(printf '%s' "$EXISTING_JSON" | jq -r ".assets[] | select(.name == \"keytao-${VERSION}.zip\") | .id" | head -n 1)
            if [ -n "$OLD_ASSET_ID" ]; then
              gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${OLD_ASSET_ID}"
            fi

            curl -fsSL -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Content-Type: application/zip" \
              --data-binary "@${ASSET}" \
              "${UPLOAD_URL}?name=keytao-${VERSION}.zip" > /dev/null

            if [ "$IS_DRAFT" = "true" ] || [ -z "$(printf '%s' "$EXISTING_BODY" | tr -d '[:space:]')" ]; then
              gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" \
                -f name="KeyTao ${VERSION}" \
                -F draft=false \
                -F body=@release/notes.md > /dev/null
            fi
          else
            python3 scripts/generate_release_notes.py "$VERSION" > release/notes.md
            gh release create "$VERSION" "$ASSET" \
              --title "KeyTao ${VERSION}" \
              --notes-file release/notes.md
          fi

      - name: Create Gitee Release and upload asset
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          RELEASE_BODY=$(cat release/notes.md)

          RESPONSE=$(curl -s -X POST \
            "https://gitee.com/api/v5/repos/xkinput/KeyTao/releases" \
            -F "access_token=${GITEE_TOKEN}" \
            -F "tag_name=${VERSION}" \
            -F "name=KeyTao ${VERSION}" \
            -F "body=${RELEASE_BODY}" \
            -F "target_commitish=master")

          RELEASE_ID=$(echo "$RESPONSE" | jq -r '.id')
          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ]; then
            echo "Failed to create Gitee release: $RESPONSE"
            exit 1
          fi
          echo "Gitee release created, id=$RELEASE_ID"

          ASSET="release/keytao-${VERSION}.zip"
          echo "Uploading $ASSET ..."
          UPLOAD_RESP=$(curl -sS -X POST \
            "https://gitee.com/api/v5/repos/xkinput/KeyTao/releases/${RELEASE_ID}/attach_files?access_token=${GITEE_TOKEN}" \
            -F "file=@${ASSET}")
          if ! echo "$UPLOAD_RESP" | jq -e '.browser_download_url or .name' > /dev/null; then
            echo "Failed to upload $ASSET: $UPLOAD_RESP"
            exit 1
          fi
          echo "$UPLOAD_RESP"
